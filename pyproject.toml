[project]
name = "enterprise-research-assistant"
version = "0.1.0"
description = "Citation-first enterprise research assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=1.5,<2.0",
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "llama-index-core>=0.14,<0.15",
    "langchain>=1.0,<2.0",
    "google-genai>=1.0,<2.0",
    "langchain-google-genai>=2.0,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pypdf>=5.0,<7.0",
    "python-multipart>=0.0.20,<1.0",
    # Ragas 0.4.3 currently imports a retired LangChain VertexAI module. The
    # evaluation layer installs a narrow compatibility bridge before importing it.
    "ragas>=0.3.9,<0.5",
    "structlog>=25.0,<27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
